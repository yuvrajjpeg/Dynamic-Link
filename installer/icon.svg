<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Dynamic Bridge</title>
  <defs>
    <linearGradient id="dl-bg" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16346F"/>
      <stop offset=".55" stop-color="#081531"/>
      <stop offset="1" stop-color="#030813"/>
    </linearGradient>
    <radialGradient id="dl-haze" cx="512" cy="470" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A7BFF" stop-opacity=".42"/>
      <stop offset="1" stop-color="#3A7BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dl-rim" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C4E2FF" stop-opacity=".38"/>
      <stop offset=".4" stop-color="#C4E2FF" stop-opacity=".07"/>
      <stop offset="1" stop-color="#C4E2FF" stop-opacity=".03"/>
    </linearGradient>
    <linearGradient id="dl-a" x1="-274" y1="0" x2="46" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1C4BDB"/>
      <stop offset="1" stop-color="#4A97FF"/>
    </linearGradient>
    <linearGradient id="dl-b" x1="-46" y1="0" x2="274" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#82C2FF"/>
      <stop offset="1" stop-color="#EAF5FF"/>
    </linearGradient>
    <radialGradient id="dl-light">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".22" stop-color="#C4E2FF" stop-opacity=".75"/>
      <stop offset="1" stop-color="#5A9BFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="dl-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dl-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="dl-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 .75  0 0 0 0 .85  0 0 0 0 1  0 0 0 1.6 -.55"/>
    </filter>
    <clipPath id="dl-squircle"><rect x="100" y="100" width="824" height="824" rx="184"/></clipPath>
    <clipPath id="dl-top"><rect x="-600" y="-600" width="1200" height="600"/></clipPath>
    <clipPath id="dl-bottom"><rect x="-600" y="0" width="1200" height="600"/></clipPath>
    <!-- Over/under: link A passes over B at the upper crossing, B over A at the lower one. -->
    <mask id="dl-cut-a" maskUnits="userSpaceOnUse" x="-600" y="-600" width="1200" height="1200">
      <rect x="-600" y="-600" width="1200" height="1200" fill="#FFFFFF"/>
      <rect x="-46" y="-100" width="320" height="200" rx="100" fill="none" stroke="#000000" stroke-width="88" clip-path="url(#dl-bottom)"/>
    </mask>
    <mask id="dl-cut-b" maskUnits="userSpaceOnUse" x="-600" y="-600" width="1200" height="1200">
      <rect x="-600" y="-600" width="1200" height="1200" fill="#FFFFFF"/>
      <rect x="-274" y="-100" width="320" height="200" rx="100" fill="none" stroke="#000000" stroke-width="88" clip-path="url(#dl-top)"/>
    </mask>
  </defs>

  <g filter="url(#dl-shadow)">
    <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#dl-bg)"/>
  </g>
  <g clip-path="url(#dl-squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#dl-haze)"/>
    <rect x="100" y="100" width="824" height="824" filter="url(#dl-grain)" opacity=".09"/>
    <g transform="translate(512 512) rotate(-45) scale(.85)">
      <g filter="url(#dl-glow)" opacity=".6">
        <rect x="-274" y="-100" width="320" height="200" rx="100" fill="none" stroke="#2F6BFF" stroke-width="52"/>
        <rect x="-46" y="-100" width="320" height="200" rx="100" fill="none" stroke="#6FB4FF" stroke-width="52"/>
      </g>
      <rect x="-274" y="-100" width="320" height="200" rx="100" fill="none" stroke="url(#dl-a)" stroke-width="52" mask="url(#dl-cut-a)"/>
      <rect x="-46" y="-100" width="320" height="200" rx="100" fill="none" stroke="url(#dl-b)" stroke-width="52" mask="url(#dl-cut-b)"/>
    </g>
    <!-- Anamorphic streak through the glint on the upper crossing. -->
    <ellipse cx="462" cy="462" rx="420" ry="4.5" fill="url(#dl-light)" opacity=".9"/>
    <ellipse cx="462" cy="462" rx="170" ry="14" fill="url(#dl-light)" opacity=".35"/>
    <circle cx="462" cy="462" r="46" fill="url(#dl-light)" opacity=".85"/>
    <circle cx="462" cy="462" r="6" fill="#FFFFFF"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="182.5" fill="none" stroke="url(#dl-rim)" stroke-width="3"/>
</svg>
